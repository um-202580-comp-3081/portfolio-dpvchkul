databases:
  -name: myapp
  plan: free
  region: ohio

services:
-type: web
name: myapp
runtime: ruby
plan: free
region: ohio
buildCommand: "./bin/render-build.sh"
startCommand: "./bin/rails server"
envVars:
  - key: DATABASE_URL
    fromDatabase:
    name: myapp-db
    property: connectionString
  - key: RAILS_ENV
    value: production
  - key: 1941f82f181262883b28345c4cbaf48d
    sync: false
  - key: WEB_CONCURRENCY
    value: 2